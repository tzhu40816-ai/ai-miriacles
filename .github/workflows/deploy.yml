name: Validate site and optionally deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.hosting.outputs.pages_enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data (blocks deploy if broken)
        run: node scripts/validate.mjs
      - name: Check whether optional GitHub Pages hosting is enabled
        id: hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          echo "pages_enabled=$pages_enabled" >> "$GITHUB_OUTPUT"
      - name: Assemble site
        if: steps.hosting.outputs.pages_enabled == 'true'
        run: |
          mkdir _site
          cp -r index.html assets data _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.hosting.outputs.pages_enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
