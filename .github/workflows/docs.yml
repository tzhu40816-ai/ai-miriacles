name: Rebuild readable docs

on:
  push:
    branches: [main]
    paths: [data/events.json, assets/i18n.js, scripts/build-docs.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - run: node scripts/build-docs.mjs
      - name: Commit regenerated Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TIMELINE.md TIMELINE.en.md domains
          git diff --cached --quiet && exit 0
          git commit -m "docs: rebuild readable pages from data/events.json [skip ci]"
          git pull --rebase origin main && git push
