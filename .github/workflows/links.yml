name: Check links

on:
  push:
    branches: [main]
    paths: [data/events.json]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-links.mjs
